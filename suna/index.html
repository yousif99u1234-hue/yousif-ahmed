<meta charset="utf-8">

<meta property="og:title" content="Suna — تقارير الفحص الهندسي">
<meta property="og:description" content="اكتب القياسات، وSuna يحسب ويحكم ويصيغ التقرير الرسمي باللغتين بنفس اللحظة.">

<title>Suna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Suna — Apple-like white & orange. Layout: frosted nav; glass cards float over a line-art oil & gas scene with mouse parallax. */
:root{
  --bg:#FBFBFD; --glass:rgba(255,255,255,.74); --surface:#FFFFFF; --surface-2:#F5F5F7; --ink:#1D1D1F; --muted:#6E6E73; --line:rgba(0,0,0,.08);
  --accent:#FF7A00; --accent-2:#FFA14A; --accent-ink:#FFFFFF; --accent-soft:#FFF1E5;
  --ok:#248A3D; --ok-soft:#E6F5EA; --warn:#A15C07; --warn-soft:#FDF3D9; --bad:#D70015; --bad-soft:#FFE6E9;
  --hazard:#FF7A00;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Arabic","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Arabic","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-mono:"SF Mono","IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 1px rgba(0,0,0,.03),0 8px 30px -12px rgba(60,30,0,.18);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,#FFFFFF 0%,#FFF8F1 55%,#FFEFE0 100%) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}
button{font:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(255,122,0,.28)!important}

/* Scene + cursor effects */
.scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.scene svg{position:absolute;inset-inline:0;bottom:0;width:100%;height:78vh;min-height:520px;direction:ltr}
.scene .layer{transition:transform 1.2s var(--ease);will-change:transform}
.pj-beam{transform-box:view-box;transform-origin:1340px 700px;animation:pump 3.2s ease-in-out infinite}
.pj-crank{transform-box:view-box;transform-origin:1420px 768px;animation:spin 3.2s linear infinite}
.flame{transform-box:view-box;transform-origin:1110px 380px;animation:flick 1.6s ease-in-out infinite}
.flow{animation:flow 2.4s linear infinite}
@keyframes pump{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.92,1.12)}60%{transform:scale(1.06,.9)}}
@keyframes flow{to{stroke-dashoffset:-56}}
#glow{position:fixed;width:620px;height:620px;left:0;top:0;margin:-310px 0 0 -310px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,40,.20) 0%,rgba(255,170,90,.08) 35%,transparent 65%);pointer-events:none;z-index:1;transition:opacity .4s;opacity:0}
#tip{position:fixed;z-index:60;pointer-events:none;background:rgba(29,29,31,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:12px;font-weight:500;padding:6px 10px;border-radius:9px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;white-space:nowrap;font-family:var(--f-body)}
#tip.on{opacity:1;transform:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s var(--ease) forwards;pointer-events:none}
.btn:not(.primary) .ripple{background:rgba(255,122,0,.18)}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* Top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:8px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;white-space:nowrap;cursor:pointer}
.brand svg{transition:transform .5s var(--ease)}
.brand:hover svg{transform:rotate(-12deg) scale(1.06)}
.brand small{font-weight:600;font-size:11px;letter-spacing:0;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1;justify-content:center;position:relative}
.tab{appearance:none;border:0;background:transparent;padding:7px 15px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:color .2s,background .2s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:#fff}
.tab .n{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:inline-grid;place-items:center}
.lang{appearance:none;border:0;background:var(--surface-2);color:var(--ink);padding:7px 15px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;transition:background .2s}
.lang:hover{background:var(--accent-soft);color:var(--accent)}

main{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:30px 22px 80px}
.view-in>*{animation:rise .6s var(--ease) both}
.view-in>*:nth-child(2){animation-delay:.05s}.view-in>*:nth-child(3){animation-delay:.1s}.view-in>*:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:4px}
.pagehead h1{font-family:var(--f-display);font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.pagehead p{margin:6px 0 0;color:var(--muted);font-size:16px;max-width:60ch}
.sample{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 12px;border-radius:999px;border:1px solid var(--line)}
.sample::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}

/* Hero */
.hero{padding:42px 0 34px;text-align:center}
.hero .eyebrow{font-size:15px}
.hero h1{font-family:var(--f-display);font-size:clamp(36px,6vw,66px);font-weight:700;letter-spacing:-.035em;line-height:1.06}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#FF5E00,#FF8A00 45%,#FFB347);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:clamp(16px,2vw,20px);color:var(--muted);margin:16px auto 26px;max-width:46ch}
.hero .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.panel{background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border:1px solid rgba(255,255,255,.7);border-radius:22px;box-shadow:var(--shadow)}
.tilt{position:relative;transform-style:preserve-3d;transition:transform .5s var(--ease),box-shadow .5s var(--ease);will-change:transform}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,150,60,.16),transparent 45%);opacity:0;transition:opacity .3s}
.tilt:hover::after{opacity:1}
.tilt:hover{box-shadow:0 1px 1px rgba(0,0,0,.03),0 22px 50px -18px rgba(255,110,0,.35)}
.btn{position:relative;overflow:hidden;appearance:none;border:0;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:14px;padding:10px 20px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:transform .35s var(--ease),background .2s,box-shadow .3s}
.btn:hover{background:#ECECEF}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#FF8A1F,#FF6F00);color:#fff;box-shadow:0 6px 18px -6px rgba(255,111,0,.6)}
.btn.primary:hover{box-shadow:0 10px 26px -6px rgba(255,111,0,.7)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.lg{font-size:16px;padding:13px 26px}
.btn.sm{padding:6px 13px;font-size:13px}
.btn .arr{transition:transform .3s var(--ease)}
.btn:hover .arr{transform:translateX(3px)}
[dir="rtl"] .btn .arr{transform:scaleX(-1)}
[dir="rtl"] .btn:hover .arr{transform:scaleX(-1) translateX(3px)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.accept,.pill.valid{background:var(--ok-soft);color:var(--ok)}
.pill.monitor,.pill.expiring{background:var(--warn-soft);color:var(--warn)}
.pill.reject,.pill.expired{background:var(--bad-soft);color:var(--bad)}

/* Inspection view */
.inspect{display:grid;grid-template-columns:minmax(340px,450px) minmax(0,1fr);gap:24px;align-items:start}
.form{overflow:hidden}
.sec{padding:18px 20px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.sec:last-child{border-bottom:0}
.sec h3{font-size:15px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
.sec h3 i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;font-weight:600;color:#fff;background:var(--accent);border-radius:6px;padding:2px 6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0}
.fld.full{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:rgba(245,245,247,.9);border:1px solid transparent;border-radius:12px;padding:9px 12px;min-width:0;width:100%;transition:box-shadow .2s,background .2s,border-color .2s}
input:hover,select:hover,textarea:hover{background:#EFEFF2}
input:focus,select:focus,textarea:focus{outline:none;background:#fff;border-color:rgba(255,122,0,.55);box-shadow:0 0 0 4px rgba(255,122,0,.16)}
textarea{resize:vertical;min-height:88px;line-height:1.6}
input.mono{text-align:center}
.methods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.mth{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:14px;padding:10px 4px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .3s var(--ease),background .25s,box-shadow .3s}
.mth:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(255,111,0,.5)}
.mth b{font-family:var(--f-mono);font-size:15px}
.mth span{font-size:10.5px;color:var(--muted);line-height:1.25;text-align:center}
.mth[aria-pressed="true"]{background:linear-gradient(180deg,#FF8A1F,#FF6F00);border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(255,111,0,.65)}
.mth[aria-pressed="true"] span{color:rgba(255,255,255,.85)}
.pts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pt{display:flex;flex-direction:column;gap:3px}
.pt label{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:center}
.pt input{padding:8px 4px;border-bottom:3px solid transparent;border-radius:10px}
.pt input.s-accept{border-bottom-color:var(--ok)}
.pt input.s-monitor{border-bottom-color:#E0A000;background:var(--warn-soft)}
.pt input.s-reject{border-bottom-color:var(--bad);background:var(--bad-soft)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.ind{display:grid;grid-template-columns:1.6fr 1fr .8fr auto;gap:6px;align-items:end}
.ind .x{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:8px;border-radius:50%;font-size:16px;line-height:1;transition:background .2s,color .2s}
.ind .x:hover{color:var(--bad);background:var(--bad-soft)}
.drop{border:1.5px dashed rgba(255,122,0,.35);border-radius:14px;padding:16px;text-align:center;color:var(--muted);cursor:pointer;font-size:13px;transition:background .2s,border-color .2s,transform .3s var(--ease);background:rgba(255,241,229,.35)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);transform:scale(1.01)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;inset-block-start:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;line-height:1}
.note{font-size:12.5px;padding:9px 12px;border-radius:12px;display:flex;gap:8px;align-items:flex-start}
.note.valid{background:var(--ok-soft);color:var(--ok)}
.note.expiring{background:var(--warn-soft);color:var(--warn)}
.note.expired{background:var(--bad-soft);color:var(--bad);font-weight:600}
.actions{padding:16px 20px;display:flex;gap:8px;flex-wrap:wrap;background:rgba(255,255,255,.5);border-top:1px solid var(--line)}

.pv{position:sticky;top:80px;min-width:0}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;color:var(--muted);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.7);box-shadow:var(--shadow)}
.live{display:inline-flex;align-items:center;gap:8px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,122,0,.55)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sheetwrap{max-height:calc(100vh - 150px);overflow:auto;border-radius:10px;padding:6px 6px 24px;scrollbar-width:thin}
.flash{animation:flashv .5s var(--ease)}
@keyframes flashv{from{background:rgba(255,160,70,.35)}to{background:transparent}}

/* Report sheet */
.paper{background:#FFFFFF;color:#1D1D1F;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.04),0 30px 60px -24px rgba(90,40,0,.35);padding:34px 38px 26px;max-width:880px;margin:0 auto;font-size:12.5px;line-height:1.5;transition:transform .5s var(--ease)}
.paper h4{font-size:12px;font-weight:700;color:#1D1D1F;margin:18px 0 8px;padding-bottom:5px;border-bottom:2px solid #FF7A00;display:flex;justify-content:space-between;gap:8px}
.paper h4 span{font-weight:500;color:#86868B;font-size:11px}
.p-head{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding-bottom:14px;border-bottom:3px solid #1D1D1F}
.p-logo{width:92px;height:52px;border:1.5px dashed #C7C7CC;border-radius:8px;display:grid;place-items:center;color:#A1A1A6;font-size:10.5px;text-align:center;padding:4px}
.p-title .t1{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.015em}
.p-title .t2{font-size:12px;color:#86868B}
.p-no{text-align:end;display:flex;flex-direction:column;gap:1px;font-size:11px;color:#86868B}
.p-no b{font-size:14px;color:#1D1D1F}
.p-band{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.p-tags{display:flex;gap:6px;flex-wrap:wrap}
.p-tag{border-radius:999px;padding:3px 10px;font-size:11px;background:#F5F5F7}
.p-tag b{font-family:var(--f-mono)}
.stamp{border:3px solid currentColor;border-radius:8px;padding:5px 16px;font-weight:800;font-size:15px;letter-spacing:.06em;transform:rotate(-3deg);display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.stamp.pop{animation:stampin .45s var(--ease)}
@keyframes stampin{from{transform:rotate(-3deg) scale(1.35);opacity:.3}to{transform:rotate(-3deg) scale(1);opacity:1}}
.stamp small{font-size:9.5px;letter-spacing:.14em;font-family:var(--f-mono)}
.c-accept{color:#248A3D}.c-monitor{color:#A15C07}.c-reject{color:#D70015}
.bg-accept{background:#E6F5EA}.bg-monitor{background:#FDF3D9}.bg-reject{background:#FFE6E9}
.ptable{width:100%;border-collapse:collapse}
.ptable th,.ptable td{border:1px solid #E5E5EA;padding:5px 8px;text-align:start;vertical-align:top}
.ptable th{background:#F5F5F7;font-weight:600;font-size:11px;color:#3A3A3C;white-space:nowrap}
.ptable.kv th{width:17%}
.ptable td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:center}
.ptable tbody tr{transition:background .15s}
.ptable tbody tr:hover{background:#FFF6EE}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #E5E5EA;border-radius:10px;overflow:hidden}
.metrics div{padding:9px 11px;border-inline-end:1px solid #F0F0F2}
.metrics div:last-child{border-inline-end:0}
.metrics span{display:block;font-size:10.5px;color:#86868B}
.metrics b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.metrics b em{font-style:normal;font-size:10.5px;font-weight:500;color:#86868B;margin-inline-start:3px}
.viz{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:12px}
.viz figure{margin:0;border:1px solid #F0F0F2;border-radius:10px;padding:8px}
.viz figcaption{font-size:10.5px;color:#86868B;margin-bottom:4px}
.viz rect[data-tip]{cursor:pointer;transition:opacity .15s}
.viz rect[data-tip]:hover{opacity:1!important;filter:brightness(1.12)}
.heat{display:grid;gap:3px;direction:ltr}
.heat div{border-radius:5px;color:#fff;font-family:var(--f-mono);font-size:10.5px;padding:6px 2px;text-align:center;line-height:1.2;cursor:pointer;transition:transform .25s var(--ease),box-shadow .25s}
.heat div:hover{transform:scale(1.14);box-shadow:0 6px 14px -4px rgba(0,0,0,.35);position:relative;z-index:1}
.heat div small{display:block;opacity:.8;font-size:9px}
.legend{display:flex;align-items:center;gap:6px;font-size:9.5px;color:#86868B;margin-top:6px;direction:ltr}
.legend i{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,hsl(0 72% 42%),hsl(40 85% 45%),hsl(130 55% 36%))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.summary{margin-top:12px;padding:10px 12px;border-inline-start:4px solid currentColor;border-radius:6px;font-size:12.5px}
.summary b{display:block;margin-bottom:2px}
.summary p{margin:0;color:#1D1D1F}
.p-notes{white-space:pre-wrap;margin:0;color:#1D1D1F}
.p-photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.p-photos figure{margin:0}
.p-photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.p-photos figcaption{font-size:10px;color:#86868B;font-family:var(--f-mono);direction:ltr;text-align:center}
.empty{color:#A1A1A6;font-style:italic}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.signs div{border:1px solid #E5E5EA;border-radius:10px;padding:10px 12px;min-height:92px;display:flex;flex-direction:column;gap:2px}
.signs span{font-size:10.5px;color:#86868B}
.signs .line{margin-top:auto;border-top:1px solid #C7C7CC;padding-top:3px;font-size:10px;color:#A1A1A6}
.warnbox{margin-top:6px;font-size:11px;font-weight:700;color:#D70015;background:#FFE6E9;padding:4px 8px;border-radius:5px}
.p-foot{margin-top:14px;padding-top:8px;border-top:1px solid #F0F0F2;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10px;color:#A1A1A6;flex-wrap:wrap}
.p-foot .by{display:inline-flex;align-items:center;gap:5px;color:#86868B;font-weight:600}

/* Overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:18px}
.kpi{padding:20px 22px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:500}
.kpi .v{font-family:var(--f-display);font-size:42px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.kpi .v.k-accent{color:var(--accent)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.ovgrid{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:16px}
.card{padding:20px 22px}
.card h2{font-size:17px;font-weight:600;margin-bottom:14px;letter-spacing:-.01em}
.hbars{display:grid;gap:12px}
.hb{display:grid;grid-template-columns:40px 1fr 26px;gap:10px;align-items:center;font-size:13px;cursor:pointer}
.hb b{font-family:var(--f-mono)}
.hb .track{height:10px;background:#EFEFF2;border-radius:999px;overflow:hidden}
.hb .fill{height:100%;background:linear-gradient(90deg,#FFB347,#FF7A00);border-radius:999px;transform-origin:left;animation:grow .9s var(--ease) both}
[dir="rtl"] .hb .fill{transform-origin:right}
.hb:hover .fill{filter:brightness(1.08) saturate(1.2)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hb .c{font-family:var(--f-mono);text-align:end;color:var(--muted)}
.list{display:grid}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 8px;margin:0 -8px;border-radius:12px;border-bottom:1px solid var(--line);font-size:13.5px;transition:background .2s}
.li:hover{background:rgba(255,241,229,.7)}
.li:last-child{border-bottom:0}
.li .meta{color:var(--muted);font-size:12px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.alert:last-child{border-bottom:0}
.alert .dot{width:9px;height:9px;border-radius:50%;margin-top:7px;flex:none}
.alert .meta{color:var(--muted);font-size:12px}
.cta{margin-top:18px;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,#1D1D1F,#3A2410);color:#fff;border:0}
.cta p{margin:0;font-weight:600;font-size:18px;letter-spacing:-.01em}
.cta span{display:block;font-weight:400;font-size:14px;opacity:.7}

/* Tables */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);text-align:start;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tbody tr{transition:background .2s}
.tbl tbody tr:hover td{background:rgba(255,241,229,.6)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.hl td{background:var(--accent-soft)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px;border-bottom:1px solid var(--line)}
.toolbar input{max-width:340px;border-radius:999px;padding-inline:16px}
.seg{display:inline-flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px;gap:2px}
.seg button{appearance:none;border:0;background:transparent;padding:6px 14px;border-radius:8px;color:var(--ink);cursor:pointer;font-weight:500;font-size:13px;transition:background .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{background:#fff;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.seg button i{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-inline-start:4px}
.days{display:flex;align-items:center;gap:10px;min-width:150px}
.days .bar{flex:1;height:6px;background:#EFEFF2;border-radius:999px;overflow:hidden;min-width:60px}
.days .bar i{display:block;height:100%;border-radius:999px;transform-origin:left;animation:grow .9s var(--ease) both}
[dir="rtl"] .days .bar i{transform-origin:right}
.days b{font-family:var(--f-mono);font-size:13px;min-width:56px}
.kind{font-size:12px;color:var(--muted)}
.addc{padding:16px;display:grid;grid-template-columns:1.4fr .8fr 1.4fr 1fr auto;gap:10px;align-items:end;border-top:1px solid var(--line);background:rgba(255,255,255,.45);border-radius:0 0 22px 22px}

#toast{position:fixed;inset-block-end:24px;left:50%;transform:translate(-50%,20px);background:rgba(29,29,31,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease);z-index:50;box-shadow:0 12px 30px -10px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.ovgrid{grid-template-columns:1fr 1fr}.ovgrid .card:last-child{grid-column:1/-1}}
@media (max-width:1000px){
  .inspect{grid-template-columns:1fr}
  .pv{position:static}
  .sheetwrap{max-height:none;overflow:visible}
  .addc{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  main{padding:20px 16px 60px}
  .tabs{justify-content:flex-start}

  .g2{grid-template-columns:1fr}
  .methods{grid-template-columns:repeat(3,1fr)}
  .pts{grid-template-columns:repeat(3,1fr)}
  .paper{padding:18px 14px}
  .p-head{grid-template-columns:1fr}
  .p-no{text-align:start}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .viz,.two,.signs{grid-template-columns:1fr}

  .addc{grid-template-columns:1fr}

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const today = new Date(); today.setHours(0,0,0,0);
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayOffset = n => { const d = new Date(today); d.setDate(d.getDate()+n); return isoOf(d); };
const parseISO = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const daysUntil = s => Math.round((parseISO(s) - today) / 86400000);
const addYears = (s, y) => { const d = parseISO(s); d.setDate(d.getDate() + Math.round(y*365)); return isoOf(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : NaN; };
const fx = (n, d=1) => isFinite(n) ? n.toFixed(d) : '—';
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ---------- engineering logic ---------- */
function compute(f){
  if (f.method === 'UT'){
    const nom = num(f.nominal), tmin = num(f.tmin), prev = num(f.prev), yrs = num(f.years);
    const rows = f.points.map((p,i) => {
      const v = num(p.v);
      const st = !isFinite(v) ? null : v < tmin ? 'reject' : v < tmin*1.1 ? 'monitor' : 'accept';
      return {id:'TML-'+pad(i+1), v, loss: isFinite(v)&&nom>0 ? (nom-v)/nom*100 : NaN, st};
    });
    const vals = rows.map(r => r.v).filter(isFinite);
    const min = vals.length ? Math.min(...vals) : NaN;
    const loss = nom > 0 ? (nom-min)/nom*100 : NaN;
    const rate = (isFinite(prev) && yrs > 0 && prev > min) ? (prev-min)/yrs : 0;
    const life = rate > 0 ? (min-tmin)/rate : Infinity;
    let result = 'accept';
    if (!isFinite(min)) result = 'accept';
    else if (min < tmin) result = 'reject';
    else if (min < tmin*1.1 || life < 4) result = 'monitor';
    const next = result === 'reject' ? 0 : Math.min(isFinite(life) ? life/2 : 10, 10);
    return {kind:'ut', rows, min, loss, rate, life, result, next, nom, tmin};
  }
  const limit = num(f.limit);
  const rows = f.inds.map((d,i) => {
    const len = num(d.len);
    const st = d.type === 'crack' || (isFinite(len) && len > limit) ? 'reject' : 'accept';
    return {...d, id:'IND-'+pad(i+1), lenN:len, st};
  });
  const rej = rows.filter(r => r.st === 'reject').length;
  const lens = rows.map(r => r.lenN).filter(isFinite);
  const max = lens.length ? Math.max(...lens) : 0;
  const result = rej ? 'reject' : (rows.length && max > limit*0.75) ? 'monitor' : 'accept';
  return {kind:'ind', rows, rej, max, limit, result};
}

/* ---------- header ---------- */
function renderTop(){
  const alertsN = state.certs.filter(c => certStatus(c) !== 'valid').length;
  const tabs = ['overview','inspect','reports','certs'].map(v => `
    <button class="tab" data-go="${v}" ${state.view===v?'aria-current="page"':''}>${t('nav_'+v)}${v==='certs'&&alertsN?`<span class="n">${alertsN}</span>`:''}</button>`).join('');

    </div>
    <nav class="tabs" aria-label="Main">${tabs}</nav>

}

/* ---------- overview ---------- */
function renderOverview(){
  const R = state.reports, last30 = R.filter(r => daysUntil(r.date) >= -30);
  const rej = R.filter(r => r.result === 'reject').length;
  const open = R.filter(r => r.result !== 'accept').length;
  const exp = state.certs.filter(c => certStatus(c) === 'expired').length;
  const soon = state.certs.filter(c => certStatus(c) === 'expiring').length;
  const byM = Object.keys(METHODS).map(m => [m, R.filter(r => r.method === m).length]);
  const maxM = Math.max(1, ...byM.map(x => x[1]));
  const alerts = [
    ...state.certs.filter(c => certStatus(c) !== 'valid').sort((a,b) => daysUntil(a.exp) - daysUntil(b.exp)).map(c => {
      const d = daysUntil(c.exp), s = certStatus(c);
      return `<div class="alert"><span class="dot" style="background:var(--${s==='expired'?'bad':'warn'})"></span><div><div>${esc(certName(c))}</div><div class="meta"><span class="ltr">${esc(c.detail)}</span> · ${s==='expired'?t('al_expired',{n:-d}):t('al_expiring',{n:d})}</div></div></div>`;
    }),
    ...R.filter(r => r.result === 'reject').slice(0,3).map(r => `<div class="alert"><span class="dot" style="background:var(--bad)"></span><div><div class="mono ltr">${r.tag} · ${r.no}</div><div class="meta">${t('al_reject')}</div></div></div>`)
  ].join('') || `<p class="meta">${t('no_alerts')}</p>`;

  $('#app').innerHTML = `
    <section class="hero"><div class="eyebrow">${t('hero_e')}</div><h1>${t('hero_t')}</h1><p>${t('hero_s')}</p><div class="row"><button class="btn primary lg magnet" data-go="inspect">${t('go_new')} <span class="arr">→</span></button><button class="btn lg" data-vjump>▶ ${t('v_watch')}</button></div></section>
    <section class="vsec" id="howto"><div class="vhead"><h2>${t('v_title')}</h2><p>${t('v_sub')}</p></div>${videoHTML()}</section>
    <div class="pagehead"><div><h1 style="font-size:26px">${t('ov_title')}</h1><p>${t('ov_sub')}</p></div><span class="sample">${t('sample')}</span></div>
    <div class="kpis">
      <div class="panel kpi tilt"><div class="l">${t('k_reports')}</div><div class="v k-accent" data-count="${last30.length}">${last30.length}</div><div class="s">${t('k_reports_s',{n:R.length})}</div></div>
      <div class="panel kpi tilt" style="--k:var(--bad)"><div class="l">${t('k_reject')}</div><div class="v" data-count="${Math.round(rej/R.length*100)}" data-suffix="%">${Math.round(rej/R.length*100)}%</div><div class="s">${t('k_reject_s',{n:rej})}</div></div>
      <div class="panel kpi tilt" style="--k:var(--warn)"><div class="l">${t('k_open')}</div><div class="v" data-count="${open}">${open}</div><div class="s">${t('k_open_s')}</div></div>
      <div class="panel kpi tilt" style="--k:var(--hazard)"><div class="l">${t('k_certs')}</div><div class="v" data-count="${exp+soon}">${exp+soon}</div><div class="s">${t('k_certs_s',{a:exp,b:soon})}</div></div>
    </div>
    <div class="ovgrid">
      <section class="panel card tilt"><h2>${t('by_method')}</h2><div class="hbars">
        ${byM.map(([m,n]) => `<div class="hb" data-tip="${m} · ${esc(L(METHODS[m]))} · ${n}"><b>${m}</b><div class="track"><div class="fill" style="width:${n/maxM*100}%"></div></div><span class="c">${n}</span></div>`).join('')}
      </div></section>
      <section class="panel card tilt"><h2>${t('recent')}</h2><div class="list">
        ${R.slice(0,6).map(r => `<div class="li"><div><div class="mono ltr" style="display:inline-block">${r.no}</div><div class="meta"><span class="ltr">${r.tag}</span> · ${esc(L(PEOPLE[r.insp]) || r.insp)} · <span class="mono">${r.date}</span></div></div><span class="pill ${r.result}">${t('res_'+r.result)}</span></div>`).join('')}
      </div></section>
      <section class="panel card tilt"><h2>${t('alerts')}</h2>${alerts}</section>
    </div>
    <div class="panel cta tilt"><p>${t('cta_t')}<span>${t('cta_s')}</span></p><button class="btn primary lg magnet" data-go="inspect">${t('go_new')} <span class="arr">→</span></button></div>`;
  mountPlayers($('#app'));

/* ---------- report sheet ---------- */
function chartSVG(c){
  const rows = c.rows, n = rows.length; if (!n) return '';
  const vals = rows.map(r => r.v).filter(isFinite);
  const W = 520, H = 190, pl = 34, pr = 66, pt = 12, pb = 24;
  const lo = Math.floor(Math.min(c.tmin, ...vals) - 1), hi = Math.ceil(Math.max(c.nom, ...vals) + 0.4);
  const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const bw = (W - pl - pr) / n;
  const step = hi - lo > 8 ? 2 : 1;
  const col = {accept:'#34A853', monitor:'#F2A900', reject:'#D70015'};
  let g = '';
  for (let v = lo; v <= hi; v += step) g += `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF0F3"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="#6B7280">${v}</text>`;
  const bars = rows.map((r,i) => {
    const x = pl + i*bw + bw*.2, w = bw*.6;
    const lab = `<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="9" fill="#6B7280">${pad(i+1)}</text>`;
    if (!isFinite(r.v)) return lab;
    const top = y(clamp(r.v, lo, hi));
    return `<rect x="${x}" y="${top}" width="${w}" height="${Math.max(0, y(lo)-top)}" rx="3" fill="${col[r.st]}" opacity="${r.st==='accept'?.78:1}" data-tip="TML-${pad(i+1)} · ${r.v.toFixed(1)} mm · −${fx(r.loss,1)}%"></rect>${lab}`;
  }).join('');
  const line = (v, color, dash, label) => isFinite(v) ? `<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${color}" stroke-width="1.5" stroke-dasharray="${dash}"/><text x="${W-pr+5}" y="${y(v)+3.5}" font-size="9.5" font-weight="600" fill="${color}">${label} ${v}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(t('r_chart'))}" style="display:block;direction:ltr;font-family:IBM Plex Mono,monospace">
    ${g}${bars}
    <line x1="${pl}" x2="${W-pr}" y1="${y(lo)}" y2="${y(lo)}" stroke="#9CA3AF"/>
    ${line(c.nom,'#6B7280','2 3','nom')}${line(c.tmin,'#B91C1C','5 3','t-min')}
  </svg>`;
}
function heatHTML(c){
  const cols = 4, span = Math.max(.1, c.nom - c.tmin);
  const cells = c.rows.map((r,i) => {
    if (!isFinite(r.v)) return `<div style="background:#E5E7EB;color:#6B7280"><small>${pad(i+1)}</small>—</div>`;
    const fr = clamp((r.v - c.tmin)/span, 0, 1);
    const bg = r.v < c.tmin ? 'hsl(0 75% 32%)' : `hsl(${Math.round(fr*130)} ${fr>.5?55:78}% ${fr>.5?36:43}%)`;
    return `<div style="background:${bg}" data-tip="TML-${pad(i+1)} · ${r.v.toFixed(1)} mm · ${t('res_'+r.st)}"><small>${pad(i+1)}</small>${r.v.toFixed(1)}</div>`;
  }).join('');
  return `<div class="heat" style="grid-template-columns:repeat(${cols},1fr)">${cells}</div><div class="legend"><span>t-min</span><i></i><span>nom</span></div>`;
}

    const nextDate = res === 'reject' ? '' : `<span class="ltr" style="font-size:10px;color:#6B7280">${addYears(f.date, c.next)}</span>`;
    const half = Math.ceil(c.rows.length/2);

    results = `
      <div class="metrics">
        <div><span>${t('r_min')}</span><b class="c-${res}">${fx(c.min,1)}<em>mm</em></b></div>
        <div><span>${t('r_loss')}</span><b>${fx(c.loss,1)}<em>%</em></b></div>

      <tbody>${c.rows.length ? c.rows.map(r => `<tr><td class="num">${r.id}</td><td><span class="ltr">${esc(r.loc)}</span></td><td>${L(ITYPES[r.type])}</td><td class="num">${fx(r.lenN,1)}</td><td class="c-${r.st}" style="font-weight:600">${t('res_'+r.st)}</td></tr>`).join('') : `<tr><td colspan="5" class="empty">—</td></tr>`}</tbody></table>`;
  }
  const sumKey = (c.kind==='ut'?'sum_':'sumi_') + res;
  const photos = state.photos.length
    ? `<div class="p-photos">${state.photos.map((p,i) => `<figure><img src="${p.url}" alt=""><figcaption>Fig. ${i+1} · ${esc(p.name.slice(0,22))}</figcaption></figure>`).join('')}</div>`

  return `<article class="paper" lang="${state.lang}">
    <div class="p-head">
      <div class="p-logo">${t('r_logo')}</div>

    <h4>${t('r_job')}</h4>
    <table class="ptable kv"><tbody>
      <tr><th>${t('f_client')}</th><td>${esc(f.client)}</td><th>${t('f_site')}</th><td>${esc(f.site)}</td></tr>
      <tr><th>${t('f_tag')}</th><td class="mono">${esc(f.tag)}</td><th>${t('f_comp')}</th><td>${esc(f.comp)}</td></tr>
      <tr><th>${t('f_mat')}</th><td class="mono">${esc(f.mat)}</td><th>${t('f_date')}</th><td class="mono">${esc(f.date)}</td></tr>

    ${photos}
    <div class="signs">
      <div><span>${t('r_insp')}</span><b>${esc(inspName)}</b><span class="ltr">${ic?esc(ic.detail):''}</span>${icS==='expired'?`<div class="warnbox">${t('cert_expired',{d:ic.exp})}</div>`:''}<div class="line">${t('r_sign')}</div></div>
      <div><span>${t('r_review')}</span><b>&nbsp;</b><div class="line">${t('r_sign')}</div></div>
    </div>
    <div class="p-foot"><span class="by">${t('r_auto')} ${LOGO(14)} Suna</span><span class="mono ltr">${no} · ${t('r_page')}</span></div>

function renderPaper(){

/* ---------- form events ---------- */
function bindForm(){
  const frm = $('#frm');
  frm.addEventListener('submit', e => e.preventDefault());
  frm.addEventListener('input', e => {
    const el = e.target, f = state.form;
    if (el.dataset.k){ f[el.dataset.k] = el.value; if (['nominal','tmin'].includes(el.dataset.k)) refreshPointMarks(); if (el.dataset.k==='insp') $('#inspNote').innerHTML = inspNoteHTML(); }
    else if (el.dataset.pt){ f.points[+el.dataset.pt].v = el.value; refreshPointMarks(); }
    else if (el.dataset.ind){ f.inds[+el.dataset.ind][el.dataset.f] = el.value; }
    else return;
    renderPaper();
  });
  frm.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const f = state.form;
    if (b.dataset.method){ f.method = b.dataset.method; f.std = {UT:'API 510',MT:'ASME Sec. V',PT:'ASME Sec. V',VT:'API 570',RT:'ASME B31.3'}[f.method]; return renderInspect(); }
    if (b.dataset.rmind){ f.inds.splice(+b.dataset.rmind,1); return renderInspect(); }
    if (b.dataset.rmph){ state.photos.splice(+b.dataset.rmph,1); $('#thumbs').innerHTML = thumbsHTML(); return renderPaper(); }
    const a = b.dataset.act;
    if (a==='addpt'){ const last = f.points[f.points.length-1]; f.points.push({v:last?last.v:''}); renderInspect(); const el = document.getElementById('pt-'+(f.points.length-1)); el && el.focus(); el && el.select(); }
    if (a==='rmpt'){ f.points.pop(); renderInspect(); }
    if (a==='addind'){ f.inds.push({loc:'', type:'linear', len:''}); renderInspect(); const el = document.getElementById('il-'+(f.inds.length-1)); el && el.focus(); }
    if (a==='save') saveReport();
    if (a==='copy') copySummary();
    if (a==='reset'){ state.form = defaultForm(); state.editing = null; state.photos = []; renderInspect(); window.scrollTo({top:0}); }
  });
  const inp = $('#f-photos'), drop = $('#drop');
  const addFiles = files => { [...files].filter(x => x.type.startsWith('image/')).slice(0, 8 - state.photos.length).forEach(x => state.photos.push({url:URL.createObjectURL(x), name:x.name})); $('#thumbs').innerHTML = thumbsHTML(); renderPaper(); };
  inp.addEventListener('change', () => { addFiles(inp.files); inp.value = ''; });
  ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));
}
function saveReport(){
  const f = state.form, res = compute(f).result, no = reportNo();
  const entry = {no, date:f.date, tag:f.tag, method:f.method, result:res, insp:f.insp, user:true, form:JSON.parse(JSON.stringify(f)), photos:[...state.photos]};
  const i = state.reports.findIndex(r => r.no === no);
  if (i >= 0) state.reports[i] = entry; else { state.reports.unshift(entry); state.seq++; }
  toast(t('saved',{no}));
  state.highlight = no; state.editing = null; state.form = defaultForm(); state.photos = [];
  go('reports');
}
function copySummary(){
  const f = state.form, c = compute(f);
  const lines = [
    `${t('r_title')} — ${reportNo()}`,
    `${t('f_client')}: ${f.client}`, `${t('f_site')}: ${f.site}`,
    `${t('f_tag')}: ${f.tag} · ${f.comp}`, `${t('r_method')}: ${f.method} · ${f.std} · ${f.date}`,

    });
    // 0 intro
    { const lt = t; const lg = q('.vlogo'); const p = ez(sg(lt,.2,1.1));

    // 1 readings
    { const lt = t - 4; let cur = 0, done = 0;

        c.lastChild.textContent = str.slice(0,n);

        if (lt >= st - .15) cur = k; if (full) done++; });
      q('.vcount').textContent = `${done} / 12 ${t_('v_pts')}`;
      const k = cur, x = 259 + (k%4)*114 + 70, y = 222 + (k/4|0)*76 + 44;
      const cu = q('.vcursor'); cu.style.left = x + 'px'; cu.style.top = y + 'px'; cu.style.opacity = sg(lt,.5,.9) * (1 - sg(lt,6.3,6.8)); cu.style.transition = 'left .25s cubic-bezier(.22,1,.36,1), top .25s cubic-bezier(.22,1,.36,1)'; }
    // 2 maths
    { const lt = t - 11;
      bars.forEach((b,k) => { const p = ez(sg(lt,.4 + k*.07, 1.1 + k*.07)), y1 = +b.dataset.y; b.setAttribute('y', 240 - (240 - y1)*p); b.setAttribute('height', (240 - y1)*p); });
      const tm = q('.vtmin'); tm.style.strokeDashoffset = 380*(1 - ez(sg(lt,1.4,2.3))); tm.style.strokeDasharray = sg(lt,1.4,2.3) >= 1 ? '6 5' : '380';
      q('.vtmint').setAttribute('opacity', sg(lt,2.1,2.5));
      mets.forEach((m,i) => { const [a0,a1,d] = metVals[i], p = ez(sg(lt,1.8 + i*.25, 3.4 + i*.25)); m.textContent = (a0 + (a1-a0)*p).toFixed(d); m.parentElement.style.color = (i===0||i===3) && p >= 1 ? '#A15C07' : ''; });
      qa('[data-s="2"] .vmet').forEach((m,i) => { const p = ez(sg(lt,1.5 + i*.15, 2.1 + i*.15)); m.style.opacity = p; m.style.transform = `translateY(${(1-p)*16}px)`; }); }
    // 3 verdict
    { const lt = t - 17; const rep = q('.vrep'), stp = q('.vstamp');
      const pin = ez(sg(lt,.1,.8)); const shake = lt > 1.45 && lt < 1.8 ? Math.sin((lt-1.45)*70)*4*(1 - sg(lt,1.45,1.8)) : 0;
      rep.style.transform = `translate(${shake}px, ${(1-pin)*30}px)`; rep.style.opacity = pin;
      const sp = sg(lt,1.1,1.45); stp.style.opacity = sp; stp.style.transform = `rotate(-6deg) scale(${2.4 - 1.4*ez(sp)})`;
      q('.vsum').style.opacity = sg(lt,1.9,2.5); }
    // 4 certificates
    { const lt = t - 22;
      rows.forEach((r,i) => { const p = ez(sg(lt,.3 + i*.22, .9 + i*.22)); r.style.opacity = p; r.style.transform = `translateY(${(1-p)*18}px)`; });
      pills.forEach((pl,i) => { const at = 1.2 + i*.45; if (lt >= at){ pl.className = 'vpill ' + pl.dataset.final; pl.textContent = pl.dataset.label; } else { pl.className = 'vpill'; pl.textContent = '···'; } });
      const sh = lt > 2.1 && lt < 2.5 ? Math.sin((lt-2.1)*80)*5*(1-sg(lt,2.1,2.5)) : 0;
      rows[2].style.transform += ` translateX(${sh}px)`; rows[2].style.boxShadow = lt >= 2.1 ? '0 0 0 2px rgba(215,0,21,.45), 0 24px 50px -20px rgba(215,0,21,.35)' : '';
      const bp = ez(sg(lt,2.8,3.3)), bn = q('.vban'); bn.style.opacity = bp; bn.style.transform = `translateY(${(1-bp)*16}px) scale(${.96+.04*bp})`; }
    // 5 outro
    { const lt = t - 27; const th = q('.vthumb'), p = ez(sg(lt,.1,.9));
      th.style.transform = `translateY(${(1-p)*40}px) rotate(${-4*p}deg)`; th.style.opacity = p;
      q('.vchk').style.strokeDashoffset = 1 - ez(sg(lt,.9,1.5));
      const ve = q('.vend'), pe = ez(sg(lt,.5,1.2)); ve.style.opacity = pe; ve.style.transform = `translateY(${(1-pe)*14}px)`;
      qa('.vlist div').forEach((d,i) => { const pp = ez(sg(lt,1.3 + i*.3, 1.8 + i*.3)); d.style.opacity = pp; d.style.transform = `translateX(${(1-pp)*(state.lang==='ar'?-14:14)}px)`; }); }
    // background drift
    qa('.vblob').forEach((b,i) => b.style.transform = `translate(${Math.sin(t/4 + i*2)*40}px, ${Math.cos(t/5 + i)*30}px)`);
    // controls
    const pr = (P.started ? t : 0)/VDUR*100;
    q('.fl').style.width = pr + '%'; q('.kn').style.left = pr + '%';
    q('.vtime').textContent = `${fmtT(P.started ? t : 0)} / ${fmtT(VDUR)}`;
    const ci = Math.max(0, VS.findIndex(([a,b]) => t >= a && t < b)); q('.vchap').textContent = P.started ? T[state.lang].vch[t >= VDUR ? 5 : ci] : '';
  }
  const t_ = k => t(k);
  let last = 0, raf = 0;
  function loop(now){
    raf = 0; if (!el.isConnected){ P.playing = false; return; }
    if (P.playing){ P.t += Math.min(.05, (now - last)/1000); last = now;
      if (P.t >= VDUR){ P.t = VDUR; setPlaying(false, true); } else raf = requestAnimationFrame(loop);
      if (now - P.idleT > 2200) frame.classList.add('idle'); }

  }
  function setPlaying(on, ended){

    q('.vbig').innerHTML = ended ? ICON.replay : ICON.play;
    if (on){ if (!P.started || P.t >= VDUR){ P.t = P.started && P.t < VDUR ? P.t : 0; } P.started = true; last = performance.now(); P.idleT = last; if (!raf) raf = requestAnimationFrame(loop); }
  }
  P.play = () => setPlaying(true); P.toggle = () => setPlaying(!P.playing);
  frame.addEventListener('click', e => { if (e.target.closest('.vctrl') && !e.target.closest('.vpp')) return; if (e.target.closest('.vpp') || e.target.closest('.vbig') || !e.target.closest('.vctrl')) P.toggle(); });
  frame.addEventListener('pointermove', () => { P.idleT = performance.now(); frame.classList.remove('idle'); });
  q('.vfs').addEventListener('click', e => { e.stopPropagation(); try { if (document.fullscreenElement) document.exitFullscreen(); else frame.requestFullscreen().catch(() => {}); } catch(_){} });
  const bar = q('.vbar');
  const seek = e => { const r = bar.getBoundingClientRect(); P.t = clamp((e.clientX - r.left)/r.width, 0, 1)*VDUR; P.started = true; if (P.t < VDUR && !P.playing) q('.vpp').innerHTML = ICON.play; draw(P.t); };
  bar.addEventListener('pointerdown', e => { e.stopPropagation(); bar.classList.add('drag'); bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener('pointermove', e => { if (bar.classList.contains('drag')) seek(e); });
  bar.addEventListener('pointerup', () => bar.classList.remove('drag'));
  bar.addEventListener('click', e => e.stopPropagation());
  draw(P.t);
}
function openVideo(){
  const m = $('#vmodal'); $('#vslot').innerHTML = videoHTML(); m.hidden = false; mountPlayers(m);
  setTimeout(() => { const p = m.querySelector('[data-vplayer]'); p && p._v && p._v.play(); }, 250);
}
function closeVideo(){ const m = $('#vmodal'); m.hidden = true; $('#vslot').innerHTML = ''; }
document.addEventListener('click', e => {
  if (e.target.closest('[data-vopen]')){ openVideo(); return; }
  if (e.target.closest('[data-vclose]') || e.target.id === 'vmodal'){ closeVideo(); return; }
  if (e.target.closest('[data-vjump]')){ const s = $('#howto'); s && s.scrollIntoView({behavior:'smooth', block:'center'}); const p = s && s.querySelector('[data-vplayer]'); setTimeout(() => p && p._v && p._v.play(), 500); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#vmodal').hidden) closeVideo(); });

/* ---------- shell ---------- */
let toastTimer;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2600); }
const VIEWS = {overview:renderOverview, inspect:renderInspect, reports:renderReports, certs:renderCerts};
function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.title = 'Suna';
  renderTop(); VIEWS[state.view]();
}
function go(v){ if (location.hash.slice(1) !== v) location.hash = v; else { state.view = v; render(); } window.scrollTo({top:0}); }
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); state.view = VIEWS[v] ? v : 'overview'; if (state.view !== 'reports') state.highlight = null; render(); animateIn(); });
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g){ e.preventDefault(); go(g.dataset.go); return; }
  if (e.target.closest('#langBtn')){
    const prev = state.lang, untouched = JSON.stringify(state.form) === JSON.stringify(defaultForm());
    state.lang = prev === 'ar' ? 'en' : 'ar';
    if (untouched && !state.editing) state.form = defaultForm();
    render(); animateIn();
  }
});
state.view = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
render(); animateIn();

/* ---------- motion & mouse ---------- */
var fine = matchMedia('(pointer: fine)').matches, calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateIn(){
  const a = $('#app'); a.classList.remove('view-in'); void a.offsetWidth; a.classList.add('view-in');
  if (calm) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const end = +el.dataset.count, suf = el.dataset.suffix || '', t0 = performance.now(), dur = 900;
    const step = now => { const p = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1-p, 3); el.textContent = Math.round(end*e) + suf; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
const glow = $('#glow'), tip = $('#tip'), layers = [...document.querySelectorAll('.scene .layer')];
let tiltEl = null, magEl = null, raf = 0, mx = innerWidth/2, my = innerHeight/2;
document.addEventListener('pointermove', e => {
  mx = e.clientX; my = e.clientY;
  if (!raf) raf = requestAnimationFrame(frame);
  // tooltip
  const tg = e.target.closest && e.target.closest('[data-tip]');
  if (tg){ tip.textContent = tg.getAttribute('data-tip'); tip.classList.add('on');
    const w = tip.offsetWidth; tip.style.left = Math.min(innerWidth - w - 8, Math.max(8, mx - w/2)) + 'px'; tip.style.top = (my - 40) + 'px'; }
  else tip.classList.remove('on');
  if (!fine || calm) return;
  // card tilt + spotlight
  const tl = e.target.closest && e.target.closest('.tilt');
  if (tiltEl && tiltEl !== tl){ tiltEl.style.transform = ''; }
  tiltEl = tl;
  if (tl){ const r = tl.getBoundingClientRect(), px = (mx - r.left)/r.width, py = (my - r.top)/r.height;
    tl.style.setProperty('--mx', px*100 + '%'); tl.style.setProperty('--my', py*100 + '%');
    const k = Math.min(1, 320 / Math.max(r.width, r.height));
    tl.style.transform = `perspective(1000px) rotateX(${(.5-py)*7*k}deg) rotateY(${(px-.5)*7*k}deg) translateY(-2px)`; }
  // magnetic buttons
  const mg = e.target.closest && e.target.closest('.magnet');
  if (magEl && magEl !== mg) magEl.style.transform = '';
  magEl = mg;
  if (mg){ const r = mg.getBoundingClientRect(); mg.style.transform = `translate(${(mx - r.left - r.width/2)*.22}px, ${(my - r.top - r.height/2)*.35}px)`; }
}, {passive:true});
function frame(){
  raf = 0;
  if (fine && !calm){ glow.style.opacity = 1; glow.style.transform = `translate(${mx}px, ${my}px)`; }
  if (calm) return;
  const dx = mx/innerWidth - .5, dy = my/innerHeight - .5;
  layers.forEach(l => { const d = +l.dataset.depth; l.style.transform = `translate(${-dx*d*2}px, ${-dy*d}px)`; });
}
document.addEventListener('pointerleave', () => { glow.style.opacity = 0; tip.classList.remove('on'); });
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn,.mth,.tab'); if (!b || calm) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height)*2.2, sp = document.createElement('span');
  sp.className = 'ripple'; sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s/2}px;top:${e.clientY - r.top - s/2}px`;
  if (getComputedStyle(b).position === 'static') b.style.position = 'relative';
  b.style.overflow = 'hidden'; b.appendChild(sp); setTimeout(() => sp.remove(), 650);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.brand')) go('overview'); });
// flash the report row that changed
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset || !el.dataset.pt) return;
  const id = 'TML-' + pad(+el.dataset.pt + 1);
  document.querySelectorAll('.paper .two td.num').forEach(td => { if (td.textContent === id){ const tr = td.parentElement; tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash'); } });
});
